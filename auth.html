<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Entrar | Clube do Cardápio</title><link rel="stylesheet" href="styles.css" /></head>
<body class="auth-page"><main class="auth-shell"><a class="brand" href="index.html"><span class="brand-mark">✦</span><span>Clube do<br /><strong>Cardápio</strong></span></a><section class="auth-card"><div class="auth-heading"><p class="eyebrow" id="auth-eyebrow">Bem-vinda de volta</p><h1 id="auth-title">Entrar na sua conta</h1><p id="auth-subtitle">Acesse seu espaço para encontrar seu cardápio.</p></div><form id="auth-form" class="auth-form"><div class="field signup-only"><label for="name">Seu nome</label><input id="name" type="text" autocomplete="name" /></div><div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required /></div><div class="field"><label for="password">Senha</label><input id="password" type="password" minlength="6" autocomplete="current-password" required /></div><button class="button button-primary" type="submit" id="auth-submit">Entrar <span>→</span></button><p class="auth-message" id="auth-message" role="status"></p></form><p class="auth-switch" id="auth-switch">Ainda não tem uma conta? <a href="auth.html?mode=signup">Criar conta</a></p><p class="prototype-note">Protótipo MVP: os dados ficam apenas neste navegador enquanto a autenticação real não é conectada.</p></section></main><script src="auth.js"></script></body></html>
